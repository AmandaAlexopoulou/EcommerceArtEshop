<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Το Καλάθι μου - Amanda's Art eShop</title>
    <link rel="stylesheet" href="css/style.css?v=1.1" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fafafa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2a2a72;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            header h1 {
                margin: 0;
                font-weight: 600;
            }

        nav a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            background-color: #ffde59;
            color: #2a2a72;
            font-weight: 700;
            border-radius: 20px;
            text-decoration: none;
            font-size: 1.1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

            nav a:hover {
                background-color: #f0c419;
                color: #1a1a4d;
                box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h2 {
            margin-bottom: 1rem;
        }

        #cart-items {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
        }

            #cart-items li {
                background: #fff;
                border-radius: 8px;
                padding: 1rem;
                margin-bottom: 1rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }

                #cart-items li .item-info {
                    flex-grow: 1;
                }

                #cart-items li .item-title {
                    font-weight: 600;
                    font-size: 1.1rem;
                }

                #cart-items li .item-qty {
                    margin-left: 1rem;
                    font-size: 0.95rem;
                    color: #666;
                }

        #cart-total {
            font-weight: 700;
            font-size: 1.3rem;
            text-align: right;
            margin-bottom: 2rem;
        }

        button#clear-cart, button#checkout-btn {
            background-color: #2a2a72;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-right: 1rem;
            transition: background-color 0.3s ease;
        }

            button#clear-cart:hover, button#checkout-btn:hover {
                background-color: #1f1f50;
            }

        .actions {
            text-align: right;
        }

        p.empty-cart {
            text-align: center;
            font-style: italic;
            color: #777;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>eShop Ζωγραφικών Έργων</h1>
        <nav>
            <a href="index.html">🏠 Αρχική</a>
            <a href="cart.html">🛒 Το καλάθι μου (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <h2>Το καλάθι αγορών μου</h2>
        <ul id="cart-items" aria-live="polite" aria-label="Προϊόντα στο καλάθι">
            <!-- Τα προϊόντα θα προστεθούν εδώ δυναμικά -->
        </ul>

        <p id="cart-total">Σύνολο: €0.00</p>

        <div class="actions">
            <button id="clear-cart" type="button">Άδειασμα Καλαθιού</button>
            <button id="checkout-btn" type="button">Ολοκλήρωση Παραγγελίας</button>
        </div>

        <p class="empty-cart" style="display:none;">Το καλάθι σου είναι άδειο.</p>
    </main>

    <footer>
        <p>&copy; 2025 Amanda's Art eShop</p>
    </footer>

    <script src="js/public.js"></script>
    <script>
        // -------------------- Cart UI --------------------
        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotalElement = document.getElementById('cart-total');
            const clearCartBtn = document.getElementById('clear-cart');
            const checkoutBtn = document.getElementById('checkout-btn');
            const emptyCartMsg = document.querySelector('.empty-cart');

            cart = JSON.parse(localStorage.getItem('cart')) || [];

            cartItemsContainer.innerHTML = '';

            if (cart.length === 0) {
                emptyCartMsg.style.display = 'block';
                cartTotalElement.textContent = 'Σύνολο: €0.00';
                cartCount.textContent = '0';
                clearCartBtn.disabled = true;
                checkoutBtn.disabled = true;
                return;
            }

            emptyCartMsg.style.display = 'none';
            clearCartBtn.disabled = false;
            checkoutBtn.disabled = false;

            let total = 0;

            cart.forEach(item => {
                const price = parseFloat(item.price) || 0;  // ✅ Διασφαλίζει αριθμό
                const subtotal = price * item.quantity;
                total += subtotal;

                const li = document.createElement('li');
                li.innerHTML = `
              <div class="item-info">
                <span class="item-title">${item.title}</span>
                <span class="item-qty">x${item.quantity}</span>
              </div>
              <div class="item-price">€${subtotal.toFixed(2)}</div>
            `;
                cartItemsContainer.appendChild(li);
            });

            cartCount.textContent = cart.reduce((sum, i) => sum + i.quantity, 0);
            cartTotalElement.textContent = `Σύνολο: €${total.toFixed(2)}`;
        }

        // Καθαρισμός καλαθιού
        document.getElementById('clear-cart').addEventListener('click', () => {
            if (confirm('Είστε σίγουροι ότι θέλετε να αδειάσετε το καλάθι;')) {
                localStorage.removeItem('cart');
                updateCartUI();
            }
        });

        // Checkout
        document.getElementById('checkout-btn').addEventListener('click', () => {
            if (!localStorage.getItem('cart') || JSON.parse(localStorage.getItem('cart')).length === 0) {
                alert('Το καλάθι είναι άδειο.');
                return;
            }
            window.location.href = 'checkout.html';
        });

        // Αρχική φόρτωση UI
        document.addEventListener('DOMContentLoaded', () => {
            updateCartUI();
        });
    </script>
</body>
</html>
